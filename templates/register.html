<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign up — Study Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>📚 Study Tracker</h1>
        <nav>
            <a href="{{ url_for('main.index') }}">Home</a>
            <a href="{{ url_for('main.login') }}">Log in</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Sign up</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flash">
                        {% for msg in messages %}
                            <li>{{ msg }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('main.register') }}" class="auth-form">
                <label>Username:
                    <input type="text" name="username" required autofocus>
                </label>
                <label>Password (min. 6 characters):
                    <input type="password" name="password" minlength="6" required>
                </label>
                <label>Confirm password:
                    <input type="password" name="password2" minlength="6" required>
                </label>
                <button type="submit">Sign up</button>
            </form>

            <p>Already have an account? <a href="{{ url_for('main.login') }}">Log in</a></p>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar matéria</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>✏️ Editar matéria</h1>
        <nav>
            <a href="{{ url_for('main.index') }}">Início</a>
        </nav>
    </header>
    <main>
        <section>
            <form action="{{ url_for('main.edit_subject', subject_id=subject.id) }}" method="post">
                <input type="text" name="name" value="{{ subject.name }}" required>
                <button type="submit">Salvar</button>
                <a href="{{ url_for('main.index') }}">Cancelar</a>
            </form>
        </section>
    </main>
</body>
</html>

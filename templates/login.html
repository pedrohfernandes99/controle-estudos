<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in — Study Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>📚 Study Tracker</h1>
        <nav>
            <a href="{{ url_for('main.index') }}">Home</a>
            <a href="{{ url_for('main.register') }}">Sign up</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Log in</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flash">
                        {% for msg in messages %}
                            <li>{{ msg }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('main.login') }}" class="auth-form">
                <label>Username:
                    <input type="text" name="username" required autofocus>
                </label>
                <label>Password:
                    <input type="password" name="password" required>
                </label>
                <button type="submit">Log in</button>
            </form>

            <p>Don't have an account? <a href="{{ url_for('main.register') }}">Sign up</a></p>
        </section>
    </main>
</body>
</html>
